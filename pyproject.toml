[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizverify"
version = "0.2.2"
description = "Official Python SDK for the BizVerify API — verify business entities against official government registries (Secretary of State, Companies House) across the US and Europe."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "BizVerify", email = "hello@bizverify.co" }]
keywords = [
    "bizverify",
    "business-verification",
    "entity-verification",
    "kyb",
    "know-your-business",
    "secretary-of-state",
    "companies-house",
    "api-client",
    "due-diligence",
    "compliance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://bizverify.co"
Repository = "https://github.com/BizVerify/bizverify-python"
Issues = "https://github.com/BizVerify/bizverify-python/issues"
Changelog = "https://github.com/BizVerify/bizverify-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/bizverify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 120
