[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizverify"
version = "1.0.0"
description = "Python SDK for the BizVerify business entity verification API"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/bizverify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 120
